<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">ONYXIA EA — Professional MetaTrader 5 Trading Assistant</title>
  <desc id="desc">A dark navy abstract trading interface banner with a glowing teal chart motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
